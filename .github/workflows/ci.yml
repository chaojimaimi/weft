# CI: build + test on every push/PR to main
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: Build + test (macOS)
    runs-on: macos-14
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        # v1.11.16: pin the channel instead of floating `stable`. New stable
        # releases ship new clippy lints and this workflow runs clippy with
        # `-D warnings`, so a floating toolchain turns upstream lint churn into
        # unexplained build failures (CI had been red since 2026-08-14). Keep
        # this value in sync with `rust-toolchain.toml`.
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.1"
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install pinned TUI dependencies
        env:
          WEFT_TMUX_PREFIX: ${{ runner.temp }}/weft-tmux-3.7b
        run: ./scripts/install_tui_test_deps.sh

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Architecture gate
        run: ./scripts/architecture_gate.sh

      - name: Test
        env:
          WEFT_REQUIRE_TMUX_ACCEPTANCE: "1"
        run: cargo test --verbose

      - name: Performance budgets
        run: ./scripts/performance_gate.sh

      - name: Build release
        run: cargo build --release

      - name: Verify .app bundle
        run: ./scripts/build-app.sh

      - name: Acceptance preflight
        run: ./scripts/acceptance_preflight.sh
