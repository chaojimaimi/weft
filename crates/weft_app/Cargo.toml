[package]
name = "weft_app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
description = "A modern macOS terminal emulator with block-based command history"

[[bin]]
name = "weft"
path = "src/main.rs"

# v1.0 V9-c: .app bundle metadata (consumed by scripts/build-app.sh).
# Not used by cargo-bundle (we use a custom script for better control).
[package.metadata.bundle]
name = "Weft"
identifier = "dev.weft.terminal"
icon = ["../../assets/icon.icns"]
version = "1.2.2"
copyright = "Copyright (c) 2026 Weft Contributors. MIT License."
short_description = "Modern macOS terminal"
long_description = "Weft is a block-based terminal emulator with command history, AI integration, and a Warp-inspired UI."
category = "public.app-category.developer-tools"
min_os_version = "12.0"

[dependencies]
weft_core = { path = "../weft_core" }
metal.workspace = true
block.workspace = true
objc2.workspace = true
objc2-metal.workspace = true
objc2-foundation.workspace = true
objc2-app-kit.workspace = true
objc2-quartz-core.workspace = true
winit.workspace = true
core-graphics-types.workspace = true
core-graphics.workspace = true
core-text.workspace = true
core-foundation.workspace = true
font-kit.workspace = true
pathfinder_geometry.workspace = true
unicode-width.workspace = true
unicode-segmentation.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
crossbeam-channel.workspace = true
regex.workspace = true
image.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "sync", "time", "io-util"] }

[dev-dependencies]
serde_json.workspace = true
