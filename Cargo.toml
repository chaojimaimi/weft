[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "1.3.1"
edition = "2021"
license = "MIT"
authors = ["Weft Contributors"]
repository = "https://github.com/chaojimaimi/weft"
homepage = "https://github.com/chaojimaimi/weft"
readme = "README.md"
keywords = ["terminal", "macos", "metal", "gpu"]
categories = ["command-line-utilities", "gui"]
rust-version = "1.75"

[workspace.dependencies]
# Core
vte = "0.13"
tokio = { version = "1", features = ["full"] }
nix = { version = "0.29", features = ["term", "process", "signal", "fs"] }

# Rendering
metal = "0.29"
objc2 = "0.5"
objc2-metal = "0.2"
objc2-foundation = { version = "0.2", features = ["NSArray", "NSData", "NSGeometry", "NSString"] }
objc2-app-kit = { version = "0.2", features = ["NSAccessibility", "NSAccessibilityConstants", "NSAccessibilityElement", "NSAccessibilityProtocols", "NSApplication", "NSWindow", "NSView", "NSRunningApplication", "NSMenu", "NSMenuItem", "NSImage", "NSTextInputContext"] }
objc2-quartz-core = { version = "0.2", features = ["CAMetalLayer"] }
winit = "0.30"
# `block` backs the `Block<...>` callback type used by Metal's
# `add_completed_handler` (frame-trace GPU timing) and other Objective-C APIs.
block = "0.1"

# Fonts
font-kit = "0.14"
rustybuzz = "0.20"
pathfinder_geometry = "0.5"

# Common
bitflags = "2"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
crossbeam-channel = "0.5"
unicode-width = "0.2"
unicode-segmentation = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
toml_edit = "0.22"
core-graphics-types = "0.1"
core-graphics = "0.23"
core-text = "20.1"
core-foundation = "0.9"
# Secret masking (v0.5 F8)
regex = "1"
# Window icon (PNG decode for winit runtime icon)
image = { version = "0.25", default-features = false, features = ["png"] }
# Persistence
rusqlite = { version = "0.31", features = ["bundled"] }
# v1.6 AI integration: HTTP client (rustls-tls to avoid OpenSSL on macOS).
# Pulled in by `crates/weft_app/src/ai/`; the module is scaffolding-only in
# v1.3 and not wired into the app shell (see ROADMAP DC-8).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
# Benchmarking (Batch 6 Step 3)
criterion = { version = "0.5", default-features = false }
