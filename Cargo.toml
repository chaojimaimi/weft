[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
# Core
vte = "0.13"
tokio = { version = "1", features = ["full"] }
nix = { version = "0.29", features = ["term", "process", "signal", "fs"] }

# Rendering
metal = "0.29"
objc2 = "0.5"
objc2-metal = "0.2"
objc2-foundation = "0.2"
objc2-app-kit = { version = "0.2", features = ["NSApplication", "NSWindow", "NSView", "NSRunningApplication"] }
objc2-quartz-core = { version = "0.2", features = ["CAMetalLayer"] }
winit = "0.30"

# Fonts
font-kit = "0.14"
rustybuzz = "0.20"
pathfinder_geometry = "0.5"

# Common
bitflags = "2"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
crossbeam-channel = "0.5"
unicode-width = "0.2"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
core-graphics-types = "0.1"
# Secret masking (v0.5 F8)
regex = "1"
# Persistence
rusqlite = { version = "0.31", features = ["bundled"] }
