[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "1.10.21"
edition = "2021"
license = "MIT"
authors = ["Weft Contributors"]
repository = "https://github.com/chaojimaimi/weft"
homepage = "https://github.com/chaojimaimi/weft"
readme = "README.md"
keywords = ["terminal", "macos", "metal", "gpu"]
categories = ["command-line-utilities", "gui"]
rust-version = "1.75"

[workspace.dependencies]
# Core
# v1.6.1: disable default `no_std` feature so `osc_raw` is a heap `Vec<u8>`
# instead of a fixed 1024-byte `ArrayVec`. OSC 8 URLs can legitimately be
# longer than 1 KiB (xterm allows up to 8 KiB); the 1 KiB ArrayVec silently
# truncated them, defeating `MAX_HYPERLINK_URL_LEN` enforcement. The
# `MAX_HYPERLINK_ENTRIES` + `MAX_HYPERLINK_URL_LEN` caps in `hyperlink.rs`
# bound memory at the application level.
vte = { version = "0.13", default-features = false }
tokio = { version = "1", features = ["full"] }
nix = { version = "0.29", features = ["term", "process", "signal", "fs"] }

# Rendering
metal = "0.29"
objc2 = "0.5"
objc2-metal = "0.2"
objc2-foundation = { version = "0.2", features = ["NSArray", "NSData", "NSGeometry", "NSString"] }
objc2-app-kit = { version = "0.2", features = ["NSAccessibility", "NSAccessibilityConstants", "NSAccessibilityElement", "NSAccessibilityProtocols", "NSApplication", "NSWindow", "NSView", "NSRunningApplication", "NSMenu", "NSMenuItem", "NSImage", "NSTextInputContext", "NSOpenPanel", "NSSavePanel", "NSPanel", "NSAlert", "NSButton"] }
objc2-quartz-core = { version = "0.2", features = ["CAMetalLayer"] }
winit = "0.30"
# `block` backs the `Block<...>` callback type used by Metal's
# `add_completed_handler` (frame-trace GPU timing) and other Objective-C APIs.
block = "0.1"

# Fonts
font-kit = "0.14"
rustybuzz = "0.20"
pathfinder_geometry = "0.5"

# Common
bitflags = { version = "2", features = ["serde"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "local-time"] }
crossbeam-channel = "0.5"
unicode-width = "0.2"
unicode-segmentation = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
toml_edit = "0.22"
core-graphics-types = "0.1"
core-graphics = "0.23"
core-text = "20.1"
core-foundation = "0.9"
# Secret masking (v0.5 F8)
regex = "1"
# v1.7.3: Markdown parsing for local Runbook (fenced shell command extraction).
# pulldown-cmark is a spec-compliant CommonMark parser — mature, no unsafe,
# and used by rustdoc itself.
pulldown-cmark = { version = "0.12", default-features = false }
# Window icon (PNG decode for winit runtime icon)
image = { version = "0.25", default-features = false, features = ["png"] }
# Persistence
rusqlite = { version = "0.31", features = ["bundled"] }
# v1.6 AI integration: HTTP client (rustls-tls to avoid OpenSSL on macOS).
# Pulled in by `crates/weft_app/src/ai/`; the module is scaffolding-only in
# v1.3 and not wired into the app shell (see ROADMAP DC-8).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
# v1.8 AI integration: StreamExt for driving reqwest's `bytes_stream()`.
# Transitive dependency of reqwest 0.12 with the `stream` feature; declared
# explicitly so weft_app can call `.next()` on the stream.
futures-util = "0.3"
# v1.8 AI integration: mock HTTP server for offline integration tests.
wiremock = "0.6"
# Benchmarking (Batch 6 Step 3)
criterion = { version = "0.5", default-features = false }
